# Day 13 Ablation A3: No Hypernetwork
# LoRA parameters are directly trained with fixed rank r=8 without hypernetwork generator.

system:
  seed: 42
  device: "cpu"
  save_dir: "results"
  log_dir: "logs/Day13/A3_no_hypernet"

wireless:
  num_users: 8
  num_bs_antennas: 64
  num_subcarriers: 64
  snr_list_db: [-5, 0, 5, 10, 15, 20, 25]
  feature_dim: 1040

data:
  data_dir: "dataset_wireless"
  environments:
    seen: ["Urban_Macro"]
  num_samples_per_env: 300
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

model:
  ablation: "A3_no_hypernet"
  backbone: "gpt2"
  freeze_backbone: true
  scene_encoder: null
  hypernetwork: false
  rank: 8
  semantic_coupling: false

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 10
